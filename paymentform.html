<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover" />
    <title>Activate Vireon • Pay Registration Fee</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        /* ===== PREMIUM DARK THEME ===== */
        :root {
            --primary: #66ccff;
            --primary-dark: #00668D;
            --primary-glow: rgba(102, 204, 255, 0.2);
            --bg-body: #0b141a;
            --bg-card: rgba(18, 28, 36, 0.92);
            --border-subtle: rgba(102, 204, 255, 0.15);
            --text-dim: rgba(255, 255, 255, 0.5);
            --text-soft: rgba(255, 255, 255, 0.85);
            --shadow-md: 0 20px 40px rgba(0, 0, 0, 0.6);
            --shadow-glow: 0 0 40px rgba(102, 204, 255, 0.05);
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background: var(--bg-body);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #ffffff;
            position: relative;
            overflow: hidden;
        }

        /* Animated background orbs */
        body::before,
        body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
            filter: blur(100px);
            opacity: 0.2;
            animation: orbFloat 12s ease-in-out infinite alternate;
        }
        body::before {
            width: 400px;
            height: 400px;
            background: var(--primary-dark);
            top: -150px;
            left: -150px;
        }
        body::after {
            width: 350px;
            height: 350px;
            background: var(--primary);
            bottom: -120px;
            right: -120px;
            animation-delay: 3s;
        }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, -30px) scale(1.1); }
        }

        .container {
            max-width: 480px;
            width: 100%;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            box-shadow: var(--shadow-md), var(--shadow-glow), 0 0 0 1px rgba(102, 204, 255, 0.08) inset;
            border: 1px solid var(--border-subtle);
            position: relative;
            z-index: 1;
            transition: var(--transition);
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 32px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(102, 204, 255, 0.2), transparent 50%, rgba(102, 204, 255, 0.1));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            z-index: -1;
        }

        /* Header */
        .header {
            padding: 24px 28px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-subtle);
        }

        .header h2 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: #fff;
        }
        .header h2 span {
            color: var(--primary);
        }

        .cancel-icon {
            background: rgba(255,255,255,0.06);
            border: none;
            color: rgba(255,255,255,0.6);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
        }
        .cancel-icon:hover {
            background: rgba(255,255,255,0.12);
            color: #fff;
            transform: rotate(90deg);
        }

        /* Content */
        .content {
            padding: 24px 28px 32px;
        }

        /* Bank info card */
        .bank-info {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 20px;
            padding: 20px 18px;
            margin-bottom: 20px;
            border: 1px solid var(--border-subtle);
            backdrop-filter: blur(4px);
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            font-size: 0.9rem;
            flex-wrap: wrap;
            gap: 6px;
        }
        .info-row:not(:last-child) {
            border-bottom: 1px solid rgba(255,255,255,0.04);
            margin-bottom: 8px;
            padding-bottom: 10px;
        }

        .info-row .label {
            color: var(--text-dim);
            font-weight: 500;
            text-transform: uppercase;
            font-size: 0.7rem;
            letter-spacing: 0.04em;
        }

        .info-row .value {
            font-weight: 600;
            color: var(--text-soft);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .account-name-bold {
            font-weight: 700;
            font-size: 0.85rem;
            color: #fff;
            background: rgba(102, 204, 255, 0.08);
            padding: 4px 14px;
            border-radius: 30px;
            border: 1px solid rgba(102, 204, 255, 0.15);
        }

        .copy-btn-small {
            background: rgba(102, 204, 255, 0.12);
            color: var(--primary);
            border: 1px solid rgba(102, 204, 255, 0.2);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.65rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: var(--transition);
        }
        .copy-btn-small:hover {
            background: var(--primary-dark);
            color: #fff;
            border-color: var(--primary-dark);
            transform: scale(1.04);
        }

        .accounts-title {
            font-weight: 600;
            margin-bottom: 14px;
            color: var(--text-soft);
            font-size: 0.85rem;
            letter-spacing: 0.02em;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .accounts-title i {
            color: var(--primary);
        }

        /* Account number row */
        .account-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.35);
            padding: 16px 20px;
            border-radius: 16px;
            margin-bottom: 18px;
            border: 1px solid var(--border-subtle);
            transition: var(--transition);
        }
        .account-item:hover {
            border-color: var(--primary);
            background: rgba(0, 0, 0, 0.5);
        }

        .account-number {
            font-size: 1.2rem;
            font-weight: 800;
            font-family: 'SF Mono', 'Courier New', monospace;
            letter-spacing: 1.5px;
            color: #fff;
        }

        .copy-btn {
            background: rgba(102, 204, 255, 0.12);
            color: var(--primary);
            border: 1px solid rgba(102, 204, 255, 0.2);
            padding: 5px 16px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
        }
        .copy-btn:hover {
            background: var(--primary-dark);
            color: #fff;
            border-color: var(--primary-dark);
            transform: scale(1.04);
        }

        /* Amount row */
        .amount-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.35);
            padding: 18px 20px;
            border-radius: 16px;
            margin: 22px 0 26px;
            border: 1px solid var(--border-subtle);
            transition: var(--transition);
        }
        .amount-row:hover {
            border-color: var(--primary);
        }

        .amount-label {
            font-weight: 600;
            color: var(--text-soft);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .amount-value {
            font-weight: 800;
            font-size: 1.6rem;
            color: var(--primary);
            text-shadow: 0 0 20px rgba(102, 204, 255, 0.15);
            letter-spacing: -0.01em;
        }

        /* Telegram button – premium style */
        .telegram-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: linear-gradient(135deg, var(--primary-dark), #0088cc);
            color: #fff;
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 16px;
            box-shadow: 0 8px 30px rgba(0, 102, 141, 0.3);
            transition: var(--transition);
            letter-spacing: 0.02em;
            position: relative;
            overflow: hidden;
        }
        .telegram-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent 60%);
            pointer-events: none;
        }
        .telegram-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(0, 102, 141, 0.5);
            background: linear-gradient(135deg, #0088cc, var(--primary-dark));
        }
        .telegram-btn i {
            font-size: 1.2rem;
        }

        .help-text {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .help-text i {
            color: var(--primary);
            margin-right: 4px;
        }

        /* Divider */
        hr {
            margin: 16px 0;
            border: none;
            border-top: 1px solid var(--border-subtle);
        }

        /* Back link */
        .back-link {
            text-align: center;
            margin-top: 6px;
        }
        .back-link a {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            transition: var(--transition);
        }
        .back-link a:hover {
            color: var(--primary);
            gap: 12px;
        }
        .back-link a i {
            transition: var(--transition);
        }
        .back-link a:hover i {
            transform: translateX(-4px);
        }

        /* Security badge */
        .security-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 10px 0 4px;
            color: var(--text-dim);
            font-size: 0.7rem;
            font-weight: 500;
        }
        .security-badge i {
            color: #4ade80;
            font-size: 0.8rem;
        }

        /* ============================================================
           OPAY WARNING POPUP – SIMPLIFIED
           ============================================================ */
        .opay-warning-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.88);
            backdrop-filter: blur(12px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .opay-warning-content {
            background: #0e1f28;
            border: 2px solid #ff6b6b;
            border-radius: 24px;
            padding: 36px 28px 30px;
            text-align: center;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 30px 50px rgba(0,0,0,0.8);
            animation: popupFadeIn 0.3s ease;
        }

        .opay-warning-content .warning-img {
            width: 150px;
            height: auto;
            margin: 0 auto 20px;
            display: block;
            filter: brightness(1.1);
            border-radius: 8px;
        }

        .opay-warning-content .warning-message {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ff6b6b;
            line-height: 1.5;
            margin-bottom: 24px;
            letter-spacing: 0.2px;
        }

        .opay-warning-content .btn-ok {
            background: #ff6b6b;
            color: #fff;
            border: none;
            padding: 14px 30px;
            font-weight: 700;
            font-size: 1rem;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 8px 18px rgba(255,107,107,0.3);
            width: 100%;
        }

        .opay-warning-content .btn-ok:hover {
            background: #ff5252;
            transform: scale(1.02);
        }

        @keyframes popupFadeIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* Responsive */
        @media (max-width: 600px) {
            body { padding: 12px; }
            .container { border-radius: 24px; }
            .header { padding: 18px 18px 14px; }
            .header h2 { font-size: 1.1rem; }
            .cancel-icon { width: 32px; height: 32px; font-size: 1rem; }
            .content { padding: 18px 18px 24px; }
            .bank-info { padding: 14px 12px; }
            .info-row { font-size: 0.8rem; flex-direction: column; align-items: flex-start; gap: 4px; }
            .info-row .value { width: 100%; justify-content: flex-start; }
            .account-number { font-size: 1rem; }
            .amount-value { font-size: 1.3rem; }
            .telegram-btn { font-size: 0.9rem; padding: 14px 16px; }
            .account-item { padding: 14px 16px; }
            .amount-row { padding: 14px 16px; flex-wrap: wrap; gap: 6px; }
            .opay-warning-content { padding: 24px 18px 22px; }
            .opay-warning-content .warning-message { font-size: 0.95rem; }
            .opay-warning-content .warning-img { width: 100px; }
        }
        @media (max-width: 380px) {
            .account-item { flex-wrap: wrap; gap: 8px; }
            .amount-row { flex-direction: column; align-items: flex-start; }
            .opay-warning-content .warning-img { width: 100px; }
            .opay-warning-content .warning-message { font-size: 0.85rem; }
        }
    </style>
</head>
<body>

    <!-- OPAY WARNING POPUP – SIMPLIFIED -->
    <div class="opay-warning-overlay" id="opayWarningPopup">
        <div class="opay-warning-content">
            <!-- Opay image -->
            <img src="opayssssss-removebg-preview.png" alt="Opay" class="warning-img" />
            <div class="warning-message">
                PLEASE DO NOT USE OPAY AS A PAYMENT METHOD.
            </div>
            <button class="btn-ok" id="opayWarningOkBtn">OK</button>
        </div>
    </div>

    <!-- Main Payment Container -->
    <div class="container" id="paymentContainer">
        <!-- Header -->
        <div class="header">
            <h2>Complete <span>Payment</span></h2>
            <a href="dashbord.html" class="cancel-icon"><i class="fas fa-times"></i></a>
        </div>

        <!-- Content -->
        <div class="content">

            <!-- Bank Details -->
            <div class="bank-info">
                <div class="info-row">
                    <span class="label">Account Name</span>
                    <span class="value">
                        <span class="account-name-bold">Trusted media page</span>
                        <button class="copy-btn-small" data-copy="Trusted media page">
                            <i class="fas fa-copy"></i> Copy
                        </button>
                    </span>
                </div>
                <div class="info-row">
                    <span class="label">Bank Name</span>
                    <span class="value">
                        <span class="account-name-bold">Moniepoint</span>
                        <button class="copy-btn-small" data-copy="Moniepoint">
                            <i class="fas fa-copy"></i> Copy
                        </button>
                    </span>
                </div>
            </div>

            <!-- Account Number -->
            <div class="accounts-title">
                <i class="fas fa-university"></i> Account Number
            </div>
            <div class="account-item">
                <span class="account-number">7025850225</span>
                <button class="copy-btn" data-copy="7025850225">
                    <i class="fas fa-copy"></i> Copy
                </button>
            </div>

            <!-- Amount -->
            <div class="amount-row">
                <span class="amount-label"><i class="fas fa-naira-sign"></i> Amount</span>
                <span class="amount-value" id="amountToPay">₦14,500</span>
            </div>

            <!-- Telegram Confirm Button -->
            <a href="https://t.me/Bigbummr01" class="telegram-btn" target="_blank">
                <i class="fab fa-telegram-plane"></i> Confirm on Telegram
            </a>

            <div class="help-text">
                <i class="fas fa-info-circle"></i> After transfer, click above to send your receipt / screenshot
            </div>

            <!-- Security Badge -->
            <div class="security-badge">
                <i class="fas fa-shield-alt"></i> Secured by Vireon
            </div>

            <hr />

            <!-- Back Link -->
            <div class="back-link">
                <a href="dashbord.html"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
            </div>

        </div>
    </div>

    <script>
        // Show Opay warning popup immediately on page load
        window.addEventListener('DOMContentLoaded', function () {
            const popup = document.getElementById('opayWarningPopup');
            const okBtn = document.getElementById('opayWarningOkBtn');

            // Show popup
            popup.style.display = 'flex';

            // On OK, hide popup
            okBtn.addEventListener('click', function () {
                popup.style.display = 'none';
            });
        });

        // Load plan price from Vireon localStorage
        const userData = JSON.parse(localStorage.getItem('vireonUserData'));
        if (userData && userData.planPrice) {
            const amount = parseInt(userData.planPrice);
            document.getElementById('amountToPay').textContent = `₦${amount.toLocaleString()}`;
        }

        // Copy functionality
        document.querySelectorAll('.copy-btn, .copy-btn-small').forEach(btn => {
            btn.addEventListener('click', function () {
                const textToCopy = this.getAttribute('data-copy');
                navigator.clipboard.writeText(textToCopy).then(() => {
                    const originalHTML = this.innerHTML;
                    const originalBg = this.style.background;
                    const originalColor = this.style.color;
                    this.innerHTML = '<i class="fas fa-check"></i> Copied!';
                    this.style.background = '#00668D';
                    this.style.color = '#fff';
                    this.style.borderColor = '#00668D';
                    setTimeout(() => {
                        this.innerHTML = originalHTML;
                        this.style.background = originalBg || '';
                        this.style.color = originalColor || '';
                        this.style.borderColor = '';
                    }, 1800);
                }).catch(() => {
                    alert(`Please copy manually: ${textToCopy}`);
                });
            });
        });
    </script>
</body>
</html>
