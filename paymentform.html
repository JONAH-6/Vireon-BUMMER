<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover" />
    <title>Pay • Complete Payment</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        /* ── reset & base ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #0b141a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            color: #fff;
            position: relative;
        }

        /* ── subtle background glow ── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 20% 30%, rgba(0, 102, 141, 0.15), transparent 60%),
                radial-gradient(circle at 80% 70%, rgba(102, 204, 255, 0.08), transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* ── main card ── */
        .container {
            max-width: 420px;
            width: 100%;
            background: rgba(18, 28, 36, 0.94);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 28px;
            border: 1px solid rgba(102, 204, 255, 0.12);
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(102, 204, 255, 0.06) inset;
            position: relative;
            z-index: 1;
            overflow: hidden;
            transition: border-color 0.3s ease;
        }

        /* ── header ── */
        .header {
            padding: 20px 24px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(102, 204, 255, 0.08);
        }

        .header h2 {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        .header h2 span {
            color: #66ccff;
        }

        .header .close-btn {
            background: rgba(255, 255, 255, 0.05);
            border: none;
            color: rgba(255, 255, 255, 0.5);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.25s ease;
            text-decoration: none;
        }
        .header .close-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            transform: rotate(90deg);
        }

        /* ── content ── */
        .content {
            padding: 20px 24px 28px;
        }

        /* bank info */
        .bank-card {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            padding: 16px 18px;
            border: 1px solid rgba(102, 204, 255, 0.08);
            margin-bottom: 18px;
        }

        .bank-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
            flex-wrap: wrap;
            gap: 4px 10px;
        }
        .bank-row:not(:last-child) {
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding-bottom: 8px;
            margin-bottom: 6px;
        }

        .bank-row .label {
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: rgba(255, 255, 255, 0.4);
        }

        .bank-row .value {
            font-weight: 600;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.9);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .bank-row .value .tag {
            background: rgba(102, 204, 255, 0.08);
            padding: 2px 12px;
            border-radius: 30px;
            border: 1px solid rgba(102, 204, 255, 0.1);
            font-weight: 600;
            font-size: 0.8rem;
        }

        .copy-tiny {
            background: rgba(102, 204, 255, 0.08);
            color: #66ccff;
            border: 1px solid rgba(102, 204, 255, 0.12);
            padding: 2px 10px;
            border-radius: 30px;
            font-size: 0.6rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-family: inherit;
        }
        .copy-tiny:hover {
            background: #00668d;
            color: #fff;
            border-color: #00668d;
        }

        /* account number */
        .acc-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .acc-title i {
            color: #66ccff;
        }

        .acc-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.35);
            padding: 14px 18px;
            border-radius: 14px;
            border: 1px solid rgba(102, 204, 255, 0.08);
            margin-bottom: 18px;
            transition: 0.25s ease;
            flex-wrap: wrap;
            gap: 10px;
        }
        .acc-box:hover {
            border-color: rgba(102, 204, 255, 0.25);
        }

        .acc-number {
            font-size: 1.15rem;
            font-weight: 800;
            font-family: 'SF Mono', 'Courier New', monospace;
            letter-spacing: 1.2px;
            color: #fff;
        }

        .copy-btn {
            background: rgba(102, 204, 255, 0.08);
            color: #66ccff;
            border: 1px solid rgba(102, 204, 255, 0.12);
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
            white-space: nowrap;
        }
        .copy-btn:hover {
            background: #00668d;
            color: #fff;
            border-color: #00668d;
        }

        /* amount */
        .amount-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 16px 18px;
            border-radius: 14px;
            border: 1px solid rgba(102, 204, 255, 0.08);
            margin: 18px 0 22px;
            flex-wrap: wrap;
            gap: 6px 12px;
        }

        .amount-row .label {
            font-weight: 600;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.7);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .amount-row .amount {
            font-weight: 800;
            font-size: 1.5rem;
            color: #66ccff;
            text-shadow: 0 0 24px rgba(102, 204, 255, 0.1);
            letter-spacing: -0.5px;
        }

        /* telegram */
        .telegram-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: linear-gradient(135deg, #00668d, #0088cc);
            color: #fff;
            text-decoration: none;
            padding: 14px 18px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.95rem;
            box-shadow: 0 6px 24px rgba(0, 102, 141, 0.3);
            transition: 0.25s ease;
            border: none;
            width: 100%;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .telegram-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), transparent 60%);
            pointer-events: none;
        }
        .telegram-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 32px rgba(0, 102, 141, 0.45);
            background: linear-gradient(135deg, #0088cc, #00668d);
        }
        .telegram-btn i {
            font-size: 1.1rem;
        }

        .help {
            text-align: center;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.35);
            margin: 12px 0 16px;
            line-height: 1.6;
        }
        .help i {
            color: #66ccff;
            margin-right: 4px;
        }

        .badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.65rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.3);
            margin: 6px 0 12px;
        }
        .badge i {
            color: #4ade80;
        }

        hr {
            border: none;
            border-top: 1px solid rgba(102, 204, 255, 0.06);
            margin: 14px 0 12px;
        }

        .back-link {
            text-align: center;
        }
        .back-link a {
            color: rgba(255, 255, 255, 0.3);
            text-decoration: none;
            font-size: 0.75rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.25s ease;
            font-weight: 500;
        }
        .back-link a:hover {
            color: #66ccff;
            gap: 10px;
        }

        /* ═══════════════════════════════════════════════
                   OPAY WARNING POPUP — FULLY RESPONSIVE
                   ═══════════════════════════════════════════════ */
        .pay-warning-overlay {
            display: none;
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 20px;
            /* fallback if flex isn't supported */
            display: none;
        }

        .pay-warning-overlay.active {
            display: flex;
        }

        .pay-warning-content {
            background: #0e1f28;
            border: 2px solid #ff6b6b;
            border-radius: 24px;
            padding: 32px 28px 28px;
            text-align: center;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 32px 56px rgba(0, 0, 0, 0.8);
            animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            transition: all 0.2s ease;
        }

        .pay-warning-content .icon-wrap {
            margin-bottom: 14px;
        }

        .pay-warning-content .icon-wrap img {
            width: 130px;
            max-width: 50%;
            height: auto;
            display: block;
            margin: 0 auto;
            filter: brightness(1.1);
            border-radius: 6px;
        }

        .pay-warning-content .msg {
            font-size: 1.05rem;
            font-weight: 700;
            color: #ff6b6b;
            line-height: 1.5;
            margin-bottom: 22px;
            letter-spacing: 0.2px;
            word-break: break-word;
        }

        .pay-warning-content .btn-ok {
            background: #ff6b6b;
            color: #fff;
            border: none;
            padding: 14px 24px;
            font-weight: 700;
            font-size: 1rem;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s ease;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.25);
            width: 100%;
            min-height: 50px;
            touch-action: manipulation;
            user-select: none;
        }

        .pay-warning-content .btn-ok:hover {
            background: #ff5252;
            transform: scale(1.02);
        }
        .pay-warning-content .btn-ok:active {
            transform: scale(0.96);
        }

        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.92) translateY(12px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* ── RESPONSIVE TWEAKS ── */

        /* tablets & small laptops */
        @media (max-width: 768px) {
            .pay-warning-content {
                max-width: 320px;
                padding: 26px 20px 22px;
            }
            .pay-warning-content .msg {
                font-size: 0.95rem;
            }
            .pay-warning-content .icon-wrap img {
                width: 110px;
            }
            .pay-warning-content .btn-ok {
                padding: 12px 18px;
                font-size: 0.9rem;
                min-height: 46px;
            }
        }

        /* large phones */
        @media (max-width: 600px) {
            body {
                padding: 12px;
            }
            .container {
                border-radius: 22px;
            }
            .header {
                padding: 16px 18px 12px;
            }
            .header h2 {
                font-size: 1rem;
            }
            .header .close-btn {
                width: 30px;
                height: 30px;
                font-size: 0.85rem;
            }
            .content {
                padding: 16px 18px 22px;
            }
            .bank-card {
                padding: 12px 14px;
            }
            .bank-row .value {
                font-size: 0.8rem;
            }
            .acc-number {
                font-size: 1rem;
                letter-spacing: 0.8px;
            }
            .amount-row .amount {
                font-size: 1.25rem;
            }
            .telegram-btn {
                font-size: 0.85rem;
                padding: 12px 14px;
            }

            .pay-warning-content {
                max-width: 300px;
                padding: 22px 16px 20px;
                border-radius: 20px;
            }
            .pay-warning-content .msg {
                font-size: 0.9rem;
                margin-bottom: 18px;
            }
            .pay-warning-content .icon-wrap img {
                width: 90px;
            }
            .pay-warning-content .btn-ok {
                padding: 10px 14px;
                font-size: 0.85rem;
                min-height: 42px;
                border-radius: 34px;
            }
            .pay-warning-overlay {
                padding: 14px;
            }
        }

        /* small phones (≤ 400px) */
        @media (max-width: 400px) {
            body {
                padding: 8px;
            }
            .container {
                border-radius: 18px;
            }
            .header h2 {
                font-size: 0.9rem;
            }
            .content {
                padding: 12px 14px 18px;
            }
            .acc-box {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
                text-align: center;
                padding: 12px 14px;
            }
            .acc-number {
                font-size: 0.9rem;
                word-break: break-all;
            }
            .copy-btn {
                justify-content: center;
                width: 100%;
            }
            .amount-row {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
                gap: 4px;
                padding: 14px 14px;
            }
            .amount-row .amount {
                font-size: 1.1rem;
            }
            .bank-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 2px;
            }
            .bank-row .value {
                width: 100%;
                justify-content: flex-start;
                flex-wrap: wrap;
            }
            .copy-tiny {
                font-size: 0.55rem;
                padding: 2px 8px;
            }

            .pay-warning-content {
                max-width: 100%;
                padding: 18px 14px 16px;
                border-radius: 18px;
                border-width: 2px;
            }
            .pay-warning-content .msg {
                font-size: 0.82rem;
                margin-bottom: 14px;
                line-height: 1.4;
            }
            .pay-warning-content .icon-wrap img {
                width: 72px;
            }
            .pay-warning-content .btn-ok {
                padding: 10px 12px;
                font-size: 0.8rem;
                min-height: 38px;
                border-radius: 30px;
            }
            .pay-warning-overlay {
                padding: 10px;
            }
        }

        /* very tiny (≤ 320px) */
        @media (max-width: 320px) {
            .pay-warning-content .msg {
                font-size: 0.75rem;
            }
            .pay-warning-content .icon-wrap img {
                width: 60px;
            }
            .pay-warning-content {
                padding: 14px 10px 12px;
                border-radius: 14px;
            }
            .pay-warning-content .btn-ok {
                font-size: 0.75rem;
                min-height: 34px;
                padding: 6px 10px;
            }
        }

        /* landscape phones – keep popup compact & usable */
        @media (max-height: 500px) and (orientation: landscape) {
            .pay-warning-overlay {
                padding: 8px 16px;
                align-items: center;
            }
            .pay-warning-content {
                max-width: 340px;
                padding: 14px 18px 14px;
                border-radius: 18px;
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                justify-content: center;
                gap: 8px 14px;
                flex-direction: row;
            }
            .pay-warning-content .icon-wrap {
                margin: 0;
                flex-shrink: 0;
            }
            .pay-warning-content .icon-wrap img {
                width: 56px;
                margin: 0;
            }
            .pay-warning-content .msg {
                font-size: 0.8rem;
                margin: 0;
                flex: 1 1 120px;
                text-align: left;
                line-height: 1.3;
            }
            .pay-warning-content .btn-ok {
                width: auto;
                min-height: 34px;
                padding: 4px 18px;
                font-size: 0.75rem;
                flex-shrink: 0;
            }
        }
    </style>
</head>
<body>

    <!-- ═══ OPAY WARNING POPUP ═══ -->
    <div class="pay-warning-overlay" id="paywarningPopup">
        <div class="pay-warning-content">
            <div class="icon-wrap">
                <img src="opayssssss-removebg-preview.png" alt="Opay" />
            </div>
            <div class="msg">PLEASE DO NOT USE OPAY AS A PAYMENT METHOD</div>
            <button class="btn-ok" id="opayWarningOkBtn">OK</button>
        </div>
    </div>

    <!-- ═══ MAIN PAYMENT CARD ═══ -->
    <div class="container" id="paymentContainer">

        <!-- header -->
        <div class="header">
            <h2>Complete <span>Payment</span></h2>
            <a href="dashbord.html" class="close-btn"><i class="fas fa-times"></i></a>
        </div>

        <!-- content -->
        <div class="content">

            <!-- bank details -->
            <div class="bank-card">
                <div class="bank-row">
                    <span class="label">Account Name</span>
                    <span class="value">
                        <span class="tag">Trusted media page</span>
                        <button class="copy-tiny" data-copy="Trusted media page">
                            <i class="fas fa-copy"></i> Copy
                        </button>
                    </span>
                </div>
                <div class="bank-row">
                    <span class="label">Bank Name</span>
                    <span class="value">
                        <span class="tag">Moniepoint</span>
                        <button class="copy-tiny" data-copy="Moniepoint">
                            <i class="fas fa-copy"></i> Copy
                        </button>
                    </span>
                </div>
            </div>

            <!-- account number -->
            <div class="acc-title">
                <i class="fas fa-university"></i> Account Number
            </div>
            <div class="acc-box">
                <span class="acc-number">7025850225</span>
                <button class="copy-btn" data-copy="7025850225">
                    <i class="fas fa-copy"></i> Copy
                </button>
            </div>

            <!-- amount -->
            <div class="amount-row">
                <span class="label"><i class="fas fa-naira-sign"></i> Amount</span>
                <span class="amount" id="amountToPay">₦14,500</span>
            </div>

            <!-- telegram -->
            <a href="https://t.me/Bigbummr01" class="telegram-btn" target="_blank">
                <i class="fab fa-telegram-plane"></i> Confirm on Telegram
            </a>

            <div class="help">
                <i class="fas fa-info-circle"></i> After transfer, click above to send your receipt / screenshot
            </div>

            <div class="badge">
                <i class="fas fa-shield-alt"></i> Secured by Vireon
            </div>

            <hr />

            <div class="back-link">
                <a href="dashbord.html"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
            </div>

        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ── show OPay warning on load ──
            const overlay = document.getElementById('paywarningPopup');
            const okBtn = document.getElementById('opayWarningOkBtn');

            function showPopup() {
                overlay.classList.add('active');
                overlay.style.display = 'flex';
            }

            function hidePopup() {
                overlay.classList.remove('active');
                overlay.style.display = 'none';
            }

            // show immediately
            showPopup();

            // OK button
            okBtn.addEventListener('click', hidePopup);

            // click on overlay background → close
            overlay.addEventListener('click', function(e) {
                if (e.target === overlay) hidePopup();
            });

            // Escape key
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && overlay.classList.contains('active')) {
                    hidePopup();
                }
            });

            // ── load amount from localStorage ──
            try {
                const stored = localStorage.getItem('vireonUserData');
                if (stored) {
                    const data = JSON.parse(stored);
                    if (data && data.planPrice) {
                        const amt = parseInt(data.planPrice);
                        if (!isNaN(amt) && amt > 0) {
                            document.getElementById('amountToPay').textContent =
                                '₦' + amt.toLocaleString();
                        }
                    }
                }
            } catch (_) { /* ignore */ }

            // ── copy functionality ──
            const copyButtons = document.querySelectorAll('.copy-btn, .copy-tiny');

            copyButtons.forEach(function(btn) {
                btn.addEventListener('click', function() {
                    const text = this.getAttribute('data-copy');
                    if (!text) return;

                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(text).then(function() {
                            showCopiedFeedback(btn);
                        }).catch(function() {
                            fallbackCopy(text, btn);
                        });
                    } else {
                        fallbackCopy(text, btn);
                    }
                });
            });

            function showCopiedFeedback(btn) {
                const orig = btn.innerHTML;
                const bg = btn.style.background;
                const color = btn.style.color;
                btn.innerHTML = '<i class="fas fa-check"></i> Copied!';
                btn.style.background = '#00668d';
                btn.style.color = '#fff';
                btn.style.borderColor = '#00668d';
                setTimeout(function() {
                    btn.innerHTML = orig;
                    btn.style.background = bg || '';
                    btn.style.color = color || '';
                    btn.style.borderColor = '';
                }, 1600);
            }

            function fallbackCopy(text, btn) {
                const area = document.createElement('textarea');
                area.value = text;
                area.style.position = 'fixed';
                area.style.opacity = '0';
                area.style.pointerEvents = 'none';
                document.body.appendChild(area);
                area.select();
                try {
                    const ok = document.execCommand('copy');
                    if (ok) {
                        showCopiedFeedback(btn);
                    } else {
                        alert('Please copy manually: ' + text);
                    }
                } catch (_) {
                    alert('Please copy manually: ' + text);
                }
                document.body.removeChild(area);
            }

        })();
    </script>

</body>
</html>
